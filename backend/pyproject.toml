[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-quick-read"
version = "2.0.2"
description = "Loopback-only backend for the Zotero Quick Read plugin"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "requests[socks]>=2.32,<3",
  "PyJWT[crypto]>=2.10,<3",
  "PyMuPDF>=1.25,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "httpx>=0.28,<1",
]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
zotero-quick-read = "zotero_quick_read.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zotero_quick_read = ["resources/*.md", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
