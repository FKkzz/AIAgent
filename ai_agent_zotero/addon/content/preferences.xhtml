<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsLoad(event)"
>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-summary"
      data-l10n-id="pref-enable-summary"
      native="true"
      preference="extensions.zotero.__addonRef__.enableSummary"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-keywords"
      data-l10n-id="pref-enable-keywords"
      native="true"
      preference="extensions.zotero.__addonRef__.enableKeywords"
    />
    <checkbox
      id="zotero-prefpane-__addonRef__-enable-both"
      data-l10n-id="pref-enable-both"
      native="true"
      preference="extensions.zotero.__addonRef__.enableBoth"
    />
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-api-url"
        data-l10n-id="pref-api-url"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-api-url"
        preference="extensions.zotero.__addonRef__.apiUrl"
        value="https://127.0.0.1:3333"
        placeholder="https://127.0.0.1:3333"
      ></html:input>
    </hbox>
  </groupbox>
  <vbox>
    <html:label
      data-l10n-id="pref-help"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></html:label>
  </vbox>
</vbox>
